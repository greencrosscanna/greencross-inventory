# ─── greencross-inventory — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `path:` is required, not cosmetic. The cross-repo suites reach `../greencross-<name>`, so the
      # main checkout has to sit in a directory NAMED greencross-inventory with its siblings beside it.
      # A bare checkout lands in the workspace root and every sibling path resolves to nothing.
      - name: Check out greencross-inventory
        uses: actions/checkout@v7
        with:
          path: greencross-inventory

      # NO TOKEN. greencross-gx-theme is PUBLIC, so actions/checkout reaches it with the default
      # GITHUB_TOKEN. This is the checkout store_normalizer_test.js needs: without it the suite still
      # exits 0, having skipped the half that reads the real gx-stores.js normalizer — i.e. the half
      # that can actually catch drift between this app's copy and the shared one.
      #
      # These steps used to be gated on a `GX_SIBLING_TOKEN` secret that was never created, so every
      # sibling checkout was a silent no-op on every run since CI was added here. The secret was also
      # unnecessary: cross-repo checkout only needs a PAT for a PRIVATE repo.
      - name: Check out greencross-gx-theme
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-gx-theme
          path: greencross-gx-theme

      # ── store_palette_drift_test.js SKIPS HERE ON PURPOSE. DO NOT "FIX" IT WITH A PAT. ────────────
      # It runs greencross-command-center/tools/store-fallback-drift.js, and that repo is PRIVATE —
      # a spoke's default GITHUB_TOKEN cannot reach it, so the only way to check it out here would be
      # a personal access token stored as a secret in a PUBLIC repo. That is a real credential with a
      # real blast radius, bought for coverage this suite ALREADY HAS: the hub's own CI checks out all
      # seven spokes and runs the same drift tool across them, so the contract is gated either way.
      # It is also still gated locally, where the hub IS a sibling and the suite runs for real.
      # So: no greencross-command-center step, a visible ⚠️ in the summary below, and no secret.
      #
      # greencross-sales and greencross-leaderboard are not checked out either — no suite in this repo
      # reads them. gx2_severance_test.js names greencross-sales only in a comment (it is modeled on
      # that repo's severance suite); every file it actually opens is this repo's own.

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-inventory
        run: sh ./gx-preflight.sh

      # Say what was NOT covered. A green check that quietly skipped a cross-repo suite is exactly the
      # failure this suite spent a week removing.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-inventory
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            if [ -d ../greencross-gx-theme ]; then
              echo "\`greencross-gx-theme\` present — store_normalizer_test.js exercised the shared"
              echo "registry path, not just this repo's copy."
            else
              echo "> **\`greencross-gx-theme\` is absent and should not be.** It is public and needs no"
              echo "> token, so this means the checkout step failed — not that the coverage is optional."
              echo "> store_normalizer_test.js skipped its registry half."
            fi
            echo ""
            echo "> **\`store_palette_drift_test.js\` skipped, by design.** It needs"
            echo "> \`greencross-command-center\`, which is PRIVATE — unreachable from a public spoke's"
            echo "> default token. The same drift check runs in the hub's own CI against all seven"
            echo "> spokes, and locally here where the hub is a sibling. **Do not add a PAT for it.**"
          } >> "$GITHUB_STEP_SUMMARY"
